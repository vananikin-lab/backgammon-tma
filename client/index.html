<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Нарды</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;overflow:hidden;background:#1a1a2e}
button{border:none;cursor:pointer;font-family:inherit}

/* ── Screens ── */
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;transition:opacity .2s}
.screen.hidden{opacity:0;pointer-events:none}

/* ══ HOME ══ */
#home{background:linear-gradient(160deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);justify-content:center}
.home-inner{display:flex;flex-direction:column;align-items:center;gap:24px;padding:40px 32px}
.home-logo{font-size:72px;filter:drop-shadow(0 4px 12px rgba(0,0,0,.5))}
.home-title{font-size:52px;font-weight:900;color:#fff;letter-spacing:-2px;text-shadow:0 2px 16px rgba(0,0,0,.4)}
.home-sub{font-size:16px;color:rgba(255,255,255,.5);font-weight:500;margin-top:-12px}
.home-btns{display:flex;flex-direction:column;gap:14px;width:100%;max-width:280px;margin-top:8px}
.game-type-btn{border-radius:50px;padding:18px 0;font-size:18px;font-weight:700;letter-spacing:.5px;transition:transform .12s,box-shadow .12s}
.game-type-btn:active{transform:scale(.96)}
.game-type-btn.short{background:linear-gradient(135deg,#3a82f7,#1a5cc8);color:#fff;box-shadow:0 6px 20px rgba(58,130,247,.45)}
.game-type-btn.long{background:linear-gradient(135deg,#e8534a,#c0392b);color:#fff;box-shadow:0 6px 20px rgba(232,83,74,.45)}

/* ══ MODAL ══ */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:flex;align-items:flex-end;justify-content:center}
.overlay.hidden{display:none}
.modal{background:#1e2a3a;border-radius:24px 24px 0 0;padding:28px 24px 40px;width:100%;max-width:480px;position:relative}
.modal-title{font-size:20px;font-weight:800;color:#fff;text-align:center;margin-bottom:6px}
.modal-sub{font-size:14px;color:#8a9ab0;text-align:center;margin-bottom:24px}
.close-btn{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.1);color:#8a9ab0;font-size:18px;display:flex;align-items:center;justify-content:center}
.score-row{display:flex;justify-content:center;gap:10px;margin-bottom:28px}
.score-chip{width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.08);color:#3a82f7;font-size:18px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer;border:2px solid transparent;transition:all .15s}
.score-chip.active{background:#3a82f7;color:#fff;border-color:#3a82f7}
.start-btn{width:100%;background:linear-gradient(135deg,#3a82f7,#1a5cc8);color:#fff;border-radius:50px;padding:17px 0;font-size:17px;font-weight:700;box-shadow:0 4px 16px rgba(58,130,247,.4)}

/* ══ WAITING ══ */
#waiting{background:#1a1a2e;justify-content:center;gap:20px}
.spinner{width:56px;height:56px;border:4px solid rgba(255,255,255,.1);border-top-color:#3a82f7;border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#waiting h2{font-size:22px;font-weight:700;color:#fff}
#waiting p{font-size:14px;color:#8a9ab0}
.cancel-btn{margin-top:8px;background:rgba(255,255,255,.08);color:#fff;border-radius:50px;padding:12px 32px;font-size:15px;font-weight:600}

/* ══ GAME ══ */
#game{background:#1a1a2e;padding:0}
.game-topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:rgba(255,255,255,.05);border-bottom:1px solid rgba(255,255,255,.08)}
.back-btn{width:32px;height:32px;display:flex;align-items:center;justify-content:center;color:#3a82f7;font-size:24px;background:none}
.game-badge{font-size:16px;font-weight:700;color:#fff}
.resign-btn{font-size:12px;color:#e85454;background:rgba(232,84,84,.12);border-radius:20px;padding:6px 12px;font-weight:600}

/* Scoreboard */
.scoreboard{display:flex;align-items:center;padding:10px 16px;gap:8px;background:rgba(255,255,255,.03)}
.pinfo{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1}
.pavatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:3px solid transparent;background:#2a3a4a;font-size:18px;display:flex;align-items:center;justify-content:center}
.pavatar.active-turn{border-color:#3a82f7;box-shadow:0 0 12px rgba(58,130,247,.5)}
.pname{font-size:11px;color:#8a9ab0;font-weight:500;max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pname.me{color:#3a82f7}
.score-center{display:flex;align-items:center;gap:8px}
.score-num{font-size:28px;font-weight:900;color:#fff;min-width:36px;text-align:center}
.score-sep{font-size:13px;color:#8a9ab0;text-align:center;line-height:1.3}

/* Board */
.board-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:4px 6px;overflow:hidden}
#boardCanvas{border-radius:12px;cursor:pointer;touch-action:manipulation;display:block}

/* Controls */
.ctrl{padding:6px 12px;background:rgba(255,255,255,.03);border-top:1px solid rgba(255,255,255,.06);min-height:72px;display:flex;align-items:center;justify-content:center}
.ctrl-opening{display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.ctrl-label{font-size:12px;color:#8a9ab0;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.opening-dice-row{display:flex;align-items:center;justify-content:center;gap:16px}
.opening-player{display:flex;flex-direction:column;align-items:center;gap:4px}
.opening-player-name{font-size:11px;color:#8a9ab0;font-weight:600}
.opening-die-wrap{width:48px;height:48px;position:relative}
canvas.mini-die{border-radius:10px}
.ctrl-moving{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.dice-row{display:flex;gap:8px;align-items:center}
.action-btns{display:flex;gap:8px}
.action-btn{width:48px;height:48px;border-radius:12px;font-size:22px;display:flex;align-items:center;justify-content:center;font-weight:700;transition:all .12s}
.action-btn:active{transform:scale(.93)}
.action-btn.undo{background:rgba(255,200,50,.12);color:#ffc832;border:2px solid rgba(255,200,50,.25)}
.action-btn.done{background:rgba(50,200,100,.12);color:#32c864;border:2px solid rgba(50,200,100,.25)}
.action-btn:disabled{opacity:.3;pointer-events:none}
.roll-btn{background:linear-gradient(135deg,#3a82f7,#1a5cc8);color:#fff;border-radius:50px;padding:13px 36px;font-size:16px;font-weight:700;box-shadow:0 4px 14px rgba(58,130,247,.4)}
.roll-btn:active{transform:scale(.96)}
.roll-btn:disabled{background:#2a3a4a;box-shadow:none;color:#8a9ab0}
.opp-turn-label{font-size:14px;color:#8a9ab0;font-weight:600}
.ctrl-roll{display:flex;align-items:center;justify-content:center;width:100%}

/* Ad */
.ad-block{height:44px;background:rgba(255,255,255,.03);width:100%;display:flex;align-items:center;justify-content:center;color:#3a4a5a;font-size:11px;border-top:1px solid rgba(255,255,255,.05)}

/* Toast */
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%) translateY(20px);background:rgba(30,42,58,.95);color:#fff;border-radius:50px;padding:10px 22px;font-size:14px;font-weight:600;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:999;white-space:nowrap;border:1px solid rgba(255,255,255,.1)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* Result overlay */
.result-overlay{position:absolute;inset:0;background:rgba(0,0,0,.7);z-index:50;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.result-overlay.hidden{display:none}
.result-card{background:#1e2a3a;border-radius:24px;padding:32px 48px;text-align:center;border:1px solid rgba(255,255,255,.1)}
.result-emoji{font-size:56px;margin-bottom:8px}
.result-title{font-size:24px;font-weight:800;color:#fff;margin-bottom:6px}
.result-sub{font-size:14px;color:#8a9ab0}
.result-btn{margin-top:20px;background:linear-gradient(135deg,#3a82f7,#1a5cc8);color:#fff;border-radius:50px;padding:14px 40px;font-size:16px;font-weight:700}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen" id="home">
  <div class="home-inner">
    <div class="home-logo">🎲</div>
    <h1 class="home-title">Нарды</h1>
    <p class="home-sub">Выберите режим игры</p>
    <div class="home-btns">
      <button class="game-type-btn short" onclick="openModal('short')">Короткие нарды</button>
      <button class="game-type-btn long" onclick="openModal('long')">Длинные нарды</button>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="overlay hidden" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <button class="close-btn" onclick="closeModal()">✕</button>
    <div class="modal-title">Параметры игры</div>
    <div class="modal-sub">До скольки очков играем?</div>
    <div class="score-row">
      <div class="score-chip active" onclick="selectScore(1)">1</div>
      <div class="score-chip" onclick="selectScore(3)">3</div>
      <div class="score-chip" onclick="selectScore(5)">5</div>
      <div class="score-chip" onclick="selectScore(11)">11</div>
      <div class="score-chip" onclick="selectScore(15)">15</div>
    </div>
    <button class="start-btn" onclick="startSearch()">Найти соперника</button>
  </div>
</div>

<!-- WAITING -->
<div class="screen hidden" id="waiting">
  <div class="spinner"></div>
  <h2>Поиск соперника…</h2>
  <p id="waitingMsg">Подбираем игрока для вас</p>
  <button class="cancel-btn" onclick="cancelSearch()">Отмена</button>
</div>

<!-- GAME -->
<div class="screen hidden" id="game">
  <div class="game-topbar">
    <button class="back-btn" onclick="leaveGame()">‹</button>
    <span class="game-badge" id="gameTypeBadge">Нарды</span>
    <button class="resign-btn" onclick="resignGame()">Сдаться</button>
  </div>
  <div class="scoreboard">
    <div class="pinfo">
      <div class="pavatar" id="myAvatarEl"></div>
      <span class="pname me" id="myNameEl">Вы</span>
    </div>
    <div class="score-center">
      <span class="score-num" id="myScoreEl">0</span>
      <div class="score-sep">до<br><span id="targetLbl">1</span></div>
      <span class="score-num" id="oppScoreEl">0</span>
    </div>
    <div class="pinfo">
      <div class="pavatar" id="oppAvatarEl"></div>
      <span class="pname" id="oppNameEl">Соперник</span>
    </div>
  </div>
  <div class="board-wrap">
    <canvas id="boardCanvas"></canvas>
  </div>
  <div class="ctrl" id="ctrl"></div>
  <div class="ad-block">Реклама</div>
  <div class="result-overlay hidden" id="resultOverlay">
    <div class="result-card">
      <div class="result-emoji" id="resultEmoji">🎉</div>
      <div class="result-title" id="resultTitle">Вы победили!</div>
      <div class="result-sub" id="resultSub"></div>
      <button class="result-btn" id="resultBtn" onclick="dismissResult()">На главную</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════════════
// Config
// ══════════════════════════════════════════════════════
const SERVER_WS = 'wss://backgammon-tma-production.up.railway.app';

// ══════════════════════════════════════════════════════
// Telegram
// ══════════════════════════════════════════════════════
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const tgUser = tg?.initDataUnsafe?.user;
const ME = {
  id:     tgUser?.id || ('guest_' + Math.random().toString(36).slice(2,8)),
  name:   tgUser ? (tgUser.first_name + (tgUser.last_name ? ' '+tgUser.last_name : '')) : 'Игрок',
  avatar: tgUser?.photo_url || '',
};

// ══════════════════════════════════════════════════════
// State
// ══════════════════════════════════════════════════════
let ws = null;
let selectedGameType = 'short';
let selectedScore = 1;
let myColor = null;
let gameState = null;
let selectedFrom = null;
let currentGameId = null;
let hintTargets = [];

// Board drawing constants (computed on resize)
let BD = {};

// ══════════════════════════════════════════════════════
// UI helpers
// ══════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('hidden', s.id !== id));
}
function showToast(msg, ms=2200) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

// ══════════════════════════════════════════════════════
// Modal
// ══════════════════════════════════════════════════════
function openModal(type) {
  selectedGameType = type;
  document.getElementById('modalOverlay').classList.remove('hidden');
  selectScore(1);
}
function closeModal(e) {
  if (e && e.target !== document.getElementById('modalOverlay')) return;
  document.getElementById('modalOverlay').classList.add('hidden');
}
function selectScore(val) {
  selectedScore = val;
  document.querySelectorAll('.score-chip').forEach(c => c.classList.toggle('active', parseInt(c.textContent)===val));
}

// ══════════════════════════════════════════════════════
// WebSocket
// ══════════════════════════════════════════════════════
function connectWS(onOpen) {
  if (ws && ws.readyState < 2) { onOpen && onOpen(); return; }
  ws = new WebSocket(SERVER_WS);
  ws.onopen = () => onOpen && onOpen();
  ws.onmessage = e => handleMessage(JSON.parse(e.data));
  ws.onclose = () => {
    showToast('Соединение прервано');
    if (gameState && gameState.phase !== 'finished') setTimeout(reconnect, 2500);
  };
}
function reconnect() { connectWS(() => {}); }
function wsSend(d) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(d)); }

// ══════════════════════════════════════════════════════
// Matchmaking
// ══════════════════════════════════════════════════════
function startSearch() {
  document.getElementById('modalOverlay').classList.add('hidden');
  connectWS(() => {
    wsSend({ type:'find_game', gameType:selectedGameType, targetScore:selectedScore, playerInfo:ME });
    showScreen('waiting');
  });
}
function cancelSearch() {
  if (ws) ws.close();
  showScreen('home');
}
function resignGame() {
  if (gameState) wsSend({ type:'resign', gameId:gameState.id });
}

// ══════════════════════════════════════════════════════
// Messages
// ══════════════════════════════════════════════════════
function handleMessage(msg) {
  switch (msg.type) {
    case 'waiting': showScreen('waiting'); break;
    case 'game_start':
    case 'opponent_joined':
      myColor = msg.yourColor || myColor;
      currentGameId = msg.id;
      applyGameState(msg);
      showScreen('game');
      setupScoreboard();
      resizeBoard();
      break;
    case 'game_state':
      applyGameState(msg);
      draw();
      updateCtrl();
      break;
    case 'hints':
      hintTargets = msg.hints || [];
      draw();
      break;
    case 'invalid_move':
      showToast('Недопустимый ход');
      selectedFrom = null; hintTargets = []; draw();
      break;
    case 'opponent_left':
      applyGameState(msg);
      showResult(msg.winner===myColor?'🏆':'💔', msg.winner===myColor?'Соперник вышел. Победа!':'Соперник вышел.', '', true);
      break;
    case 'error': showToast(msg.message); break;
    case 'invite_created':
      currentGameId = msg.gameId;
      myColor = msg.yourColor;
      document.getElementById('waitingMsg').textContent = 'Ожидаем друга…';
      break;
    case 'pong': break;
  }
}

function applyGameState(msg) {
  gameState = {
    id: msg.id, gameType: msg.gameType, targetScore: msg.targetScore,
    board: msg.board, bar: msg.bar, bearOff: msg.bearOff,
    currentPlayer: msg.currentPlayer, dice: msg.dice,
    phase: msg.phase, openingRolls: msg.openingRolls || {white:null,black:null},
    scores: msg.scores, players: msg.players,
    winner: msg.winner, roundWinner: msg.roundWinner,
    canUndo: !!msg.canUndo,
  };
  if (msg.roundWinner) {
    const iWon = msg.roundWinner === myColor;
    if (msg.phase === 'finished') {
      showResult(iWon?'🏆':'😞', iWon?'Вы победили!':'Вы проиграли', 'Матч завершён', true);
    } else {
      showResult(iWon?'🎉':'😔', iWon?'Раунд ваш!':'Соперник взял раунд', 'Счёт обновлён', false);
    }
  }
  draw();
  updateCtrl();
}

function setupScoreboard() {
  if (!gameState) return;
  const me = gameState.players[myColor];
  const opp = gameState.players[myColor==='white'?'black':'white'];
  document.getElementById('gameTypeBadge').textContent = gameState.gameType==='short'?'Короткие нарды':'Длинные нарды';
  document.getElementById('targetLbl').textContent = gameState.targetScore;
  setAvatar('myAvatarEl', me);
  setAvatar('oppAvatarEl', opp);
  document.getElementById('myNameEl').textContent = me?.name || 'Вы';
  document.getElementById('oppNameEl').textContent = opp?.name || 'Соперник';
}
function setAvatar(id, info) {
  const el = document.getElementById(id);
  if (info?.avatar) {
    el.innerHTML = `<img src="${info.avatar}" style="width:100%;height:100%;border-radius:50%;object-fit:cover" onerror="this.parentElement.textContent='${(info.name||'?')[0].toUpperCase()}'">`;
  } else {
    el.textContent = (info?.name || '?')[0].toUpperCase();
    el.style.cssText = 'display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#3a82f7,#1a5cc8);color:#fff;font-weight:700;font-size:18px';
  }
}
function updateScoreboard() {
  if (!gameState) return;
  const isMyTurn = gameState.currentPlayer === myColor;
  document.getElementById('myAvatarEl').classList.toggle('active-turn', isMyTurn);
  document.getElementById('oppAvatarEl').classList.toggle('active-turn', !isMyTurn && !!gameState.currentPlayer);
  document.getElementById('myScoreEl').textContent = gameState.scores[myColor] || 0;
  document.getElementById('oppScoreEl').textContent = gameState.scores[myColor==='white'?'black':'white'] || 0;
}

// ══════════════════════════════════════════════════════
// Controls
// ══════════════════════════════════════════════════════
function updateCtrl() {
  if (!gameState) return;
  updateScoreboard();
  const ctrl = document.getElementById('ctrl');
  const { phase, currentPlayer, dice, canUndo, openingRolls } = gameState;
  const isMyTurn = currentPlayer === myColor;

  if (phase === 'opening_roll') {
    const myRoll = openingRolls[myColor];
    const oppRoll = openingRolls[myColor==='white'?'black':'white'];
    const bothRolled = myRoll !== null && oppRoll !== null;
    ctrl.innerHTML = `
      <div class="ctrl-opening">
        <div class="ctrl-label">${bothRolled && myRoll===oppRoll ? '⚡ Ничья! Бросайте ещё раз' : 'Кто ходит первым?'}</div>
        <div class="opening-dice-row">
          <div class="opening-player">
            <span class="opening-player-name">Вы</span>
            <canvas id="myOpenDie" width="48" height="48" style="border-radius:10px"></canvas>
          </div>
          <span style="color:#8a9ab0;font-size:18px;font-weight:700">vs</span>
          <div class="opening-player">
            <span class="opening-player-name">Соперник</span>
            <canvas id="oppOpenDie" width="48" height="48" style="border-radius:10px"></canvas>
          </div>
        </div>
        ${myRoll===null ? '<button class="roll-btn" onclick="sendOpeningRoll()" style="padding:11px 28px;font-size:15px">Бросить кубик</button>' : '<span class="opp-turn-label">Ожидаем соперника…</span>'}
      </div>`;
    drawMiniDie('myOpenDie', myRoll, myColor==='white'?'white':'black');
    drawMiniDie('oppOpenDie', oppRoll, myColor==='white'?'black':'white');

  } else if (phase === 'rolling') {
    ctrl.innerHTML = `<div class="ctrl-roll">${isMyTurn
      ? '<button class="roll-btn" onclick="sendRoll()">🎲 Бросить кубики</button>'
      : '<span class="opp-turn-label">Ход соперника…</span>'}</div>`;

  } else if (phase === 'moving') {
    const diceHTML = dice.map((d,i) => `<canvas id="dieC${i}" width="44" height="44" style="border-radius:9px;cursor:pointer" onclick="onDieClick(${i})"></canvas>`).join('');
    ctrl.innerHTML = `
      <div class="ctrl-moving">
        <div class="action-btns">
          <button class="action-btn undo" onclick="sendUndo()" ${canUndo&&isMyTurn?'':'disabled'} title="Отменить ход">↩</button>
          <button class="action-btn done" onclick="sendDone()" ${canUndo&&isMyTurn?'':'disabled'} title="Завершить ход">✓</button>
        </div>
        <div class="dice-row">${diceHTML}</div>
        <div style="width:104px;text-align:right">
          ${!isMyTurn ? '<span class="opp-turn-label">Ход соперника</span>' : ''}
        </div>
      </div>`;
    dice.forEach((d,i) => drawMiniDie(`dieC${i}`, d, isMyTurn?'white':'dark'));

  } else if (phase === 'finished') {
    ctrl.innerHTML = `<div class="ctrl-roll"><button class="roll-btn" onclick="leaveGame()">На главную</button></div>`;
  }
}

// ── Mini die drawing ──
function drawMiniDie(canvasId, value, style) {
  const c = document.getElementById(canvasId);
  if (!c) return;
  const ctx = c.getContext('2d');
  const W = c.width, H = c.height;
  ctx.clearRect(0,0,W,H);
  const r = W*0.16;
  // Background
  if (style === 'white') { ctx.fillStyle='#FFFFFF'; }
  else if (style === 'black') { ctx.fillStyle='#1a1a1a'; }
  else if (style === 'dark') { ctx.fillStyle='#2a3a4a'; }
  else { ctx.fillStyle='#FFFFFF'; }
  roundRectFill(ctx,0,0,W,H,r);
  if (value === null) {
    // Unknown
    ctx.fillStyle = style==='black'?'rgba(255,255,255,.3)':'rgba(0,0,0,.2)';
    ctx.font=`bold ${Math.round(W*0.45)}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('?', W/2, H/2);
    return;
  }
  // Dots
  const dotColor = (style==='black'||style==='dark') ? '#FFFFFF' : '#1a1a1a';
  ctx.fillStyle = dotColor;
  const dr = W*0.1;
  const off = W*0.28;
  const mid = W*0.5;
  const dots = {
    1:[[mid,mid]],
    2:[[off,off],[W-off,H-off]],
    3:[[off,off],[mid,mid],[W-off,H-off]],
    4:[[off,off],[W-off,off],[off,H-off],[W-off,H-off]],
    5:[[off,off],[W-off,off],[mid,mid],[off,H-off],[W-off,H-off]],
    6:[[off,off],[W-off,off],[off,mid],[W-off,mid],[off,H-off],[W-off,H-off]],
  };
  (dots[value]||[]).forEach(([x,y]) => {
    ctx.beginPath(); ctx.arc(x,y,dr,0,Math.PI*2); ctx.fill();
  });
}

function roundRectFill(ctx,x,y,w,h,r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath(); ctx.fill();
}

// ══════════════════════════════════════════════════════
// Actions
// ══════════════════════════════════════════════════════
function sendOpeningRoll() { wsSend({ type:'opening_roll', gameId:gameState.id }); }
function sendRoll() { wsSend({ type:'roll_dice', gameId:gameState.id }); }
function sendUndo() { wsSend({ type:'undo_move', gameId:gameState.id }); selectedFrom=null; hintTargets=[]; }
function sendDone() { wsSend({ type:'done_turn', gameId:gameState.id }); selectedFrom=null; hintTargets=[]; }
function onDieClick(i) { /* dice selection if needed */ }

// ══════════════════════════════════════════════════════
// Board — display indices
// ══════════════════════════════════════════════════════
function getDisplayIndices() {
  if (myColor === 'white') {
    return {
      topLeft:  [23,22,21,20,19,18],
      topRight: [17,16,15,14,13,12],
      botLeft:  [11,10,9,8,7,6],
      botRight: [5,4,3,2,1,0],
    };
  } else {
    return {
      topLeft:  [0,1,2,3,4,5],
      topRight: [6,7,8,9,10,11],
      botLeft:  [12,13,14,15,16,17],
      botRight: [18,19,20,21,22,23],
    };
  }
}

// ══════════════════════════════════════════════════════
// Board — canvas draw
// ══════════════════════════════════════════════════════
function resizeBoard() {
  const wrap = document.querySelector('.board-wrap');
  const canvas = document.getElementById('boardCanvas');
  if (!wrap || !canvas) return;
  const wW = wrap.clientWidth - 12;
  const wH = wrap.clientHeight - 8;
  // Maintain aspect ratio ~1.6:1
  let W = wW, H = Math.round(W / 1.6);
  if (H > wH) { H = wH; W = Math.round(H * 1.6); }
  canvas.width = W; canvas.height = H;
  const B = Math.max(8, Math.round(W * 0.02));
  const BAR = Math.round(W * 0.065);
  const PW = (W - 2*B - BAR) / 12;
  const PH = (H - 2*B) * 0.84;
  const CR = Math.min(PW * 0.43, PH / 5 * 0.48);
  BD = { W, H, B, BAR, PW, PH, CR, barX: (W-BAR)/2 };
  draw();
}

function draw() {
  const canvas = document.getElementById('boardCanvas');
  if (!canvas || !gameState) return;
  const ctx = canvas.getContext('2d');
  const { W, H, B, BAR, PW, PH, CR, barX } = BD;
  if (!W) return;

  ctx.clearRect(0,0,W,H);

  // ── Outer frame (wood)
  ctx.fillStyle = '#6B3010';
  roundRectFill(ctx,0,0,W,H,14);

  // ── Inner surface
  ctx.fillStyle = '#C8872A';
  roundRectFill(ctx,B,B,W-2*B,H-2*B,10);

  // ── Bar
  ctx.fillStyle = '#5A2800';
  ctx.fillRect(barX, B, BAR, H-2*B);
  // Bar border lines
  ctx.strokeStyle = '#3a1800';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(barX, B); ctx.lineTo(barX, H-B); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(barX+BAR, B); ctx.lineTo(barX+BAR, H-B); ctx.stroke();

  const di = getDisplayIndices();

  // ── Triangles
  function drawTriangle(col, isTop, xOff, isLeft) {
    const x = xOff + col * PW;
    // Alternate colors: dark/light pattern
    const isDark = isLeft ? (col % 2 === (isTop ? 0 : 1)) : (col % 2 === (isTop ? 1 : 0));
    ctx.fillStyle = isDark ? '#8B1A1A' : '#E8D0A0';
    ctx.beginPath();
    if (isTop) {
      ctx.moveTo(x, B); ctx.lineTo(x+PW, B); ctx.lineTo(x+PW/2, B+PH);
    } else {
      ctx.moveTo(x, H-B); ctx.lineTo(x+PW, H-B); ctx.lineTo(x+PW/2, H-B-PH);
    }
    ctx.closePath(); ctx.fill();
  }

  for (let c=0;c<6;c++) {
    drawTriangle(c, true,  B,        true);
    drawTriangle(c, true,  barX+BAR, false);
    drawTriangle(c, false, B,        true);
    drawTriangle(c, false, barX+BAR, false);
  }

  // ── Checkers
  function drawCheckersAt(boardIdx, col, isTop, xOff) {
    const val = gameState.board[boardIdx];
    if (val === 0) return;
    const count = Math.abs(val);
    const color = val > 0 ? 'white' : 'black';
    const cx = xOff + col*PW + PW/2;
    const maxShow = Math.min(count, 5);
    const spacing = Math.min(CR*2 - 1, (PH*0.9) / maxShow);
    const isSelected = boardIdx === selectedFrom;

    for (let i=0;i<maxShow;i++) {
      const cy = isTop ? (B + CR + i*spacing) : (H-B-CR - i*spacing);
      drawChecker(ctx, cx, cy, CR, color, isSelected && i === 0);
    }
    if (count > 5) {
      const lastCy = isTop ? (B + CR + 4*spacing) : (H-B-CR - 4*spacing);
      ctx.fillStyle = color === 'white' ? '#333' : '#fff';
      ctx.font = `bold ${Math.round(CR*0.85)}px sans-serif`;
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(count, cx, lastCy);
    }

    // Hint dot on this point
    if (hintTargets.some(h => h.to === boardIdx)) {
      const dotY = isTop ? B+PH*0.72 : H-B-PH*0.72;
      ctx.fillStyle = 'rgba(58,130,247,0.65)';
      ctx.beginPath(); ctx.arc(cx, dotY, CR*0.52, 0, Math.PI*2); ctx.fill();
    }
  }

  for (let c=0;c<6;c++) {
    drawCheckersAt(di.topLeft[c],  c, true,  B);
    drawCheckersAt(di.topRight[c], c, true,  barX+BAR);
    drawCheckersAt(di.botLeft[c],  c, false, B);
    drawCheckersAt(di.botRight[c], c, false, barX+BAR);
  }

  // Hint dots on empty points
  hintTargets.forEach(h => {
    if (h.to === 'bearoff') return;
    const idx = h.to;
    const val = gameState.board[idx];
    if (val !== 0) return; // already drawn with checkers
    // Find position
    let cx = null, cy = null;
    const check = (arr, isTop, xOff) => {
      for (let c=0;c<6;c++) {
        if (arr[c] === idx) {
          cx = xOff + c*PW + PW/2;
          cy = isTop ? B+PH*0.72 : H-B-PH*0.72;
        }
      }
    };
    check(di.topLeft,  true,  B);
    check(di.topRight, true,  barX+BAR);
    check(di.botLeft,  false, B);
    check(di.botRight, false, barX+BAR);
    if (cx !== null) {
      ctx.fillStyle = 'rgba(58,130,247,0.65)';
      ctx.beginPath(); ctx.arc(cx, cy, CR*0.52, 0, Math.PI*2); ctx.fill();
    }
  });

  // Bear-off hint indicator
  if (hintTargets.some(h => h.to === 'bearoff')) {
    const isWhite = myColor === 'white';
    // White bears off on the right (beyond botRight), Black on the left (beyond botLeft)
    const bx = isWhite ? W-B/2 : B/2;
    const by = H/2;
    ctx.fillStyle = 'rgba(58,130,247,0.7)';
    ctx.strokeStyle = '#3a82f7';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(bx, by, CR*0.7, 0, Math.PI*2); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(CR*0.6)}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText('↑', bx, by);
  }

  // ── Bar checkers
  drawBarCheckers(ctx);
}

function drawChecker(ctx, cx, cy, r, color, selected) {
  ctx.save();
  if (selected) {
    ctx.shadowColor='rgba(255,200,0,.9)';
    ctx.shadowBlur=12;
  } else {
    ctx.shadowColor='rgba(0,0,0,.5)';
    ctx.shadowBlur=5; ctx.shadowOffsetY=2;
  }
  const g = ctx.createRadialGradient(cx-r*.28, cy-r*.28, r*.05, cx, cy, r);
  if (color==='white') {
    g.addColorStop(0,'#FFFFFF'); g.addColorStop(.6,'#E0E0E0'); g.addColorStop(1,'#B0B0B0');
  } else {
    g.addColorStop(0,'#666'); g.addColorStop(.5,'#222'); g.addColorStop(1,'#080808');
  }
  ctx.fillStyle=g;
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.shadowBlur=0; ctx.shadowOffsetY=0;
  // Outer ring
  ctx.strokeStyle = color==='white'?'rgba(0,0,0,.25)':'rgba(255,255,255,.12)';
  ctx.lineWidth=1.5; ctx.stroke();
  // Inner ring highlight
  ctx.strokeStyle = color==='white'?'rgba(255,255,255,.9)':'rgba(255,255,255,.08)';
  ctx.lineWidth=1;
  ctx.beginPath(); ctx.arc(cx,cy,r*.68,0,Math.PI*2); ctx.stroke();
  if (selected) {
    ctx.strokeStyle='rgba(255,200,0,.9)'; ctx.lineWidth=2.5;
    ctx.beginPath(); ctx.arc(cx,cy,r+2,0,Math.PI*2); ctx.stroke();
  }
  ctx.restore();
}

function drawBarCheckers(ctx) {
  if (!gameState) return;
  const { W, H, B, BAR, CR, barX } = BD;
  const { bar } = gameState;
  const bcx = barX + BAR/2;
  const r = Math.min(CR, BAR*0.4);
  // White on bar (bottom half)
  for (let i=0;i<Math.min(bar.white,4);i++) {
    const cy = H/2 + r + i*(r*2+2);
    drawChecker(ctx, bcx, cy, r, 'white', false);
  }
  if (bar.white > 4) {
    ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(r)}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(bar.white, bcx, H/2+r+3*(r*2+2));
  }
  // Black on bar (top half)
  for (let i=0;i<Math.min(bar.black,4);i++) {
    const cy = H/2 - r - i*(r*2+2);
    drawChecker(ctx, bcx, cy, r, 'black', false);
  }
  if (bar.black > 4) {
    ctx.fillStyle='#fff'; ctx.font=`bold ${Math.round(r)}px sans-serif`;
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(bar.black, bcx, H/2-r-3*(r*2+2));
  }
  // Bar click hints
  const isWhite = myColor==='white';
  if (hintTargets.some(h => h.to !== 'bearoff') && selectedFrom==='bar') {
    // handled in getClickedBoardIndex
  }
}

// ══════════════════════════════════════════════════════
// Click handling
// ══════════════════════════════════════════════════════
function getClickedBoardIndex(x, y) {
  const { W, H, B, BAR, PW, barX } = BD;
  // Bar
  if (x >= barX && x <= barX+BAR) return 'bar';
  // Bear-off zones (edges)
  if (x < B/2 || x > W-B/2) return 'bearoff';
  const di = getDisplayIndices();
  const isTop = y < H/2;
  const isLeft = x < barX;
  const xOff = isLeft ? B : barX+BAR;
  let col = Math.floor((x - xOff) / PW);
  col = Math.max(0, Math.min(5, col));
  if (isTop && isLeft)  return di.topLeft[col];
  if (isTop && !isLeft) return di.topRight[col];
  if (!isTop && isLeft) return di.botLeft[col];
  return di.botRight[col];
}

document.getElementById('boardCanvas').addEventListener('click', e => {
  if (!gameState || gameState.phase !== 'moving') return;
  if (gameState.currentPlayer !== myColor) return;
  const canvas = document.getElementById('boardCanvas');
  const rect = canvas.getBoundingClientRect();
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (e.clientX - rect.left) * scaleX;
  const y = (e.clientY - rect.top)  * scaleY;
  const idx = getClickedBoardIndex(x, y);
  if (idx === null) return;
  handlePointClick(idx);
});

document.getElementById('boardCanvas').addEventListener('touchend', e => {
  e.preventDefault();
  if (!gameState || gameState.phase !== 'moving') return;
  if (gameState.currentPlayer !== myColor) return;
  const canvas = document.getElementById('boardCanvas');
  const rect = canvas.getBoundingClientRect();
  const touch = e.changedTouches[0];
  const scaleX = canvas.width / rect.width;
  const scaleY = canvas.height / rect.height;
  const x = (touch.clientX - rect.left) * scaleX;
  const y = (touch.clientY - rect.top)  * scaleY;
  const idx = getClickedBoardIndex(x, y);
  if (idx === null) return;
  handlePointClick(idx);
}, { passive: false });

function handlePointClick(idx) {
  const { board, bar } = gameState;
  const isWhite = myColor === 'white';

  // Bear off
  if (idx === 'bearoff') {
    if (selectedFrom !== null && hintTargets.some(h => h.to === 'bearoff')) {
      const hint = hintTargets.find(h => h.to === 'bearoff');
      wsSend({ type:'move', gameId:gameState.id, from:selectedFrom, to:'bearoff', dieIndex:hint.dieIndex });
      selectedFrom=null; hintTargets=[];
    }
    return;
  }

  // Bar click
  if (idx === 'bar') {
    const myBar = isWhite ? bar.white : bar.black;
    if (myBar > 0) {
      selectedFrom = 'bar'; hintTargets = [];
      wsSend({ type:'get_hints', gameId:gameState.id, from:'bar' });
      draw();
    }
    return;
  }

  // Hint target click
  const hint = hintTargets.find(h => h.to === idx);
  if (hint && selectedFrom !== null) {
    wsSend({ type:'move', gameId:gameState.id, from:selectedFrom, to:idx, dieIndex:hint.dieIndex });
    selectedFrom=null; hintTargets=[];
    return;
  }

  // Own checker click
  const val = gameState.board[idx];
  const isOwn = isWhite ? val > 0 : val < 0;
  if (isOwn) {
    selectedFrom = idx; hintTargets = [];
    draw();
    wsSend({ type:'get_hints', gameId:gameState.id, from:idx });
  } else {
    selectedFrom=null; hintTargets=[]; draw();
  }
}

// ══════════════════════════════════════════════════════
// Results
// ══════════════════════════════════════════════════════
let _resultFinal = false;
function showResult(emoji, title, sub, isFinal) {
  _resultFinal = isFinal;
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSub').textContent = sub;
  document.getElementById('resultBtn').textContent = isFinal ? 'На главную' : 'Продолжить';
  document.getElementById('resultOverlay').classList.remove('hidden');
}
function dismissResult() {
  document.getElementById('resultOverlay').classList.add('hidden');
  if (_resultFinal) leaveGame();
}

// ══════════════════════════════════════════════════════
// Leave
// ══════════════════════════════════════════════════════
function leaveGame() {
  gameState=null; currentGameId=null; myColor=null; selectedFrom=null; hintTargets=[];
  document.getElementById('resultOverlay').classList.add('hidden');
  showScreen('home');
}

setInterval(() => { if (ws && ws.readyState===1) wsSend({ type:'ping' }); }, 25000);
